name: Lint and Test

on:
  workflow_call:
    inputs:
      path:
        description: Specific path to lint instead of the default `.`.
        required: false
        type: string
        default: "."

permissions: {}

jobs:
  lint:
    name: Lint with ansible-lint and ruff
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - name: Install ruff
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0

      - name: Lint with ruff
        run: ruff check --diff ${INPUTS_PATH}
        env:
          INPUTS_PATH: ${{ inputs.path }}

      - name: Format with ruff
        run: ruff format --diff ${INPUTS_PATH}
        env:
          INPUTS_PATH: ${{ inputs.path }}

      - name: Lint with ansible-lint
        uses: ansible/ansible-lint@665d9e07a1943254d2910faffc106adaf7ea7294 # v26.8.0
        with:
          setup_python: false
          working_directory: ${{ inputs.path }}
